# Production deploys wait for this job: vercel.json's ignoreCommand
# (scripts/vercel-ignore-build.mjs) only builds main once "check" succeeds.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
